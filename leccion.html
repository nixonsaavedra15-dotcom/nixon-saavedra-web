<script>
const params = new URLSearchParams(window.location.search);
const enrollmentId = params.get('enrollment');
const moduleId = params.get('module');

// Orden fijo de los pasos de una lección multi-paso (debe coincidir
// exactamente con supabase/functions/update-lesson-step/index.ts).
const STEP_ORDER = ['welcome','reading1','reading2','quiz_readings','interactive','quiz_interactive','practice','closing','done'];
const STEP_LABELS = { welcome:'Bienvenida', reading1:'Lectura 1', reading2:'Lectura 2', quiz_readings:'Quiz', interactive:'Interactivo', quiz_interactive:'Quiz', practice:'Práctica', closing:'Cierre', done:'Listo' };

function temaDelModulo(mod){
  const t = (mod?.title || '').toLowerCase();
  if (t.includes('introduc')) return 'intro';
  if (t.includes('gramática') || t.includes('gramatica') || t.includes('use of language') || t.includes('to be')) return 'grammar';
  if (t.includes('listening') || t.includes('escucha')) return 'listening';
  if (t.includes('speaking') || t.includes('oral')) return 'speaking';
  if (t.includes('writing') || t.includes('escritura')) return 'writing';
  if (t.includes('simulacro') || t.includes('certificaci') || t.includes('examen')) return 'exam';
  if (t.includes('lectura') || t.includes('reading') || t.includes('aviso') || t.includes('enunciado') || t.includes('diálogo') || t.includes('dialogo') || t.includes('texto')) return 'reading';
  return 'general';
}

let CURRENT_ENROLLMENT_ID = null;
let CURRENT_MODULE_ID = null;

(async () => {
  if(!supabaseReady()){
    document.getElementById('lesson-root').innerHTML = '<div class="empty-state">El Campus todavía no está conectado a la base de datos.</div>';
    return;
  }

  const session = await requireSession();
  if(!session) return;

  if(!enrollmentId || !moduleId){
    document.getElementById('lesson-root').innerHTML = '<div class="empty-state">Falta información del módulo. <a href="dashboard.html">Vuelve a tu Campus</a> y entra desde ahí.</div>';
    return;
  }
  CURRENT_ENROLLMENT_ID = enrollmentId;
  CURRENT_MODULE_ID = moduleId;

  const { data: enrollment } = await supabaseClient
    .from('enrollments')
    .select('id, user_id, course:courses(id, title, slug)')
    .eq('id', enrollmentId)
    .maybeSingle();

  if(!enrollment || enrollment.user_id !== session.user.id){
    document.getElementById('lesson-root').innerHTML = '<div class="empty-state">No tienes acceso a este módulo.</div>';
    return;
  }

  document.getElementById('breadcrumb-course').textContent = enrollment.course.title;

  const { data: mod } = await supabaseClient.from('modules').select('*').eq('id', moduleId).maybeSingle();
  const { data: progressRow } = await supabaseClient
    .from('progress').select('*').eq('enrollment_id', enrollmentId).eq('module_id', moduleId).maybeSingle();

  if(!mod || !progressRow){
    document.getElementById('lesson-root').innerHTML = '<div class="empty-state">No encontramos este módulo.</div>';
    return;
  }

  if(!progressRow.unlocked){
    renderLocked(mod);
    return;
  }

  if(mod.lesson_json){
    initFlow(mod, progressRow);
  } else {
    renderLesson(mod, progressRow);
    await loadQuiz(enrollmentId, moduleId);
  }
})();

function renderLocked(mod){
  document.getElementById('lesson-root').innerHTML = `
    <div class="locked-box">
      <h2 class="serif" style="font-size:26px;margin-bottom:14px;">Módulo bloqueado</h2>
      <p>Primero debes aprobar el módulo anterior con al menos 75/100 para desbloquear "${mod.title}".</p>
      <a href="dashboard.html" class="btn btn-outline" style="margin-top:22px;">Volver a mi Campus</a>
    </div>
  `;
}

/* ============================================================
   FORMATO ANTIGUO — una sola página + un cuestionario
   (se mantiene intacto para los módulos que aún no tienen lesson_json)
   ============================================================ */

function renderLesson(mod, progressRow){
  document.getElementById('lesson-title').textContent = mod.title;
  document.getElementById('lesson-illustration').innerHTML = obtenerIlustracion(temaDelModulo(mod));
  document.getElementById('lesson-body').innerHTML = mod.description || '<p>Sin contenido todavía.</p>';

  if(progressRow.completed){
    document.getElementById('lesson-status').innerHTML =
      `<span class="badge badge-completed">Completado — nota ${progressRow.grade ?? '—'}/100</span>`;
  } else {
    document.getElementById('lesson-status').innerHTML = `<span class="badge badge-active">En curso</span>`;
  }
}

async function loadQuiz(enrollmentId, moduleId, stage){
  stage = stage || 'main';
  const container = document.getElementById('quiz-container') || document.getElementById('stage-container');
  const { data: quiz } = await supabaseClient.from('quizzes').select('*').eq('module_id', moduleId).eq('stage', stage).maybeSingle();

  if(!quiz){
    container.innerHTML = '<div class="empty-state">Este módulo todavía no tiene cuestionario.</div>';
    return;
  }

  const { data: questions } = await supabaseClient
    .from('quiz_questions').select('*').eq('quiz_id', quiz.id).order('order_index');

  if(!questions || questions.length === 0){
    container.innerHTML = '<div class="empty-state">Este cuestionario todavía no tiene preguntas.</div>';
    return;
  }

  const { data: choices } = await supabaseClient
    .from('quiz_choices_public').select('*').in('question_id', questions.map(q => q.id)).order('order_index');

  // Preguntas con audio evaluativo (Listening): traemos cuántas veces ya
  // se reprodujo cada una, para pintar el botón con el estado correcto
  // desde el primer render (por si recargó la página a medio quiz).
  const audioQuestionIds = questions.filter(q => q.audio_url).map(q => q.id);
  let playsByQuestion = {};
  if(audioQuestionIds.length){
    const { data: plays } = await supabaseClient
      .from('quiz_question_audio_plays')
      .select('question_id, plays_used')
      .eq('enrollment_id', enrollmentId)
      .in('question_id', audioQuestionIds);
    (plays || []).forEach(p => { playsByQuestion[p.question_id] = p.plays_used; });
  }

  renderQuizForm(quiz, questions, choices || [], enrollmentId, moduleId, stage, container, playsByQuestion);
}

const MAX_AUDIO_PLAYS = 2;

async function playEvaluativeAudio(enrollmentId, questionId, btn){
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Cargando audio...';

  const { data, error } = await supabaseClient.functions.invoke('register-audio-play', {
    body: { enrollment_id: enrollmentId, question_id: questionId },
  });

  if(error || data?.error){
    alert('No se pudo reproducir el audio: ' + (data?.error || error.message));
    btn.disabled = false;
    btn.textContent = original;
    return;
  }

  if(!data.allowed){
    btn.disabled = true;
    btn.textContent = '🔒 Ya no puedes reproducir este audio';
    btn.title = data.message || '';
    const warn = document.getElementById('audio-warn-' + questionId);
    if(warn) warn.textContent = data.message || `Ya usaste tus ${MAX_AUDIO_PLAYS} reproducciones.`;
    return;
  }

  const player = document.getElementById('audio-el-' + questionId);
  player.src = data.audio_url;
  player.play();

  if(data.plays_left > 0){
    btn.disabled = false;
    btn.textContent = `▶ Reproducir de nuevo (${data.plays_left} disponible${data.plays_left === 1 ? '' : 's'})`;
    const warn = document.getElementById('audio-warn-' + questionId);
    if(warn) warn.textContent = `Después de esta reproducción te queda ${data.plays_left} más — luego no podrás volver a escucharlo.`;
  } else {
    btn.disabled = true;
    btn.textContent = '🔒 Ya usaste tus 2 reproducciones';
    const warn = document.getElementById('audio-warn-' + questionId);
    if(warn) warn.textContent = 'Esta era tu última reproducción — ya no podrás volver a escuchar este audio.';
  }
}

function audioGateHtml(q, enrollmentId, playsByQuestion){
  if(!q.audio_url) return '';
  const used = playsByQuestion[q.id] || 0;
  const left = Math.max(MAX_AUDIO_PLAYS - used, 0);
  const locked = left <= 0;
  const btnLabel = locked
    ? '🔒 Ya usaste tus 2 reproducciones'
    : (used === 0 ? '▶ Reproducir audio (2 disponibles)' : `▶ Reproducir de nuevo (${left} disponible${left === 1 ? '' : 's'})`);
  const warnText = locked
    ? 'Ya no puedes volver a escuchar este audio.'
    : `Solo puedes reproducirlo ${MAX_AUDIO_PLAYS} veces en total — después de la segunda, no podrás volver a escucharlo.`;
  return `
    <div class="audio-eval-box" style="background:var(--bg-alt);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;">
      <button type="button" class="btn btn-outline" style="cursor:pointer;font-size:13px;padding:9px 16px;" ${locked ? 'disabled' : ''}
        onclick="playEvaluativeAudio('${enrollmentId}', '${q.id}', this)">${btnLabel}</button>
      <audio id="audio-el-${q.id}" style="display:none;"></audio>
      <div id="audio-warn-${q.id}" style="font-size:12px;color:var(--wine);margin-top:8px;">${warnText}</div>
    </div>
  `;
}

function renderQuizForm(quiz, questions, choices, enrollmentId, moduleId, stage, container, playsByQuestion){
  playsByQuestion = playsByQuestion || {};
  container = container || document.getElementById('quiz-container');
  container.innerHTML = `
    <div class="quiz-card reveal in">
      <h3 class="serif" style="font-size:22px;margin-bottom:8px;">${quiz.title}</h3>
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:30px;">
        Necesitas ${quiz.passing_score}/100 para ${stage === 'main' ? 'desbloquear el siguiente módulo' : 'continuar con la lección'}.
        ${quiz.is_final ? ` Este es el examen final: tienes ${quiz.max_attempts ?? '∞'} intentos en total.` : ' Puedes intentarlo las veces que necesites hasta lograrlo.'}
      </p>
      <form id="quiz-form">
        ${questions.map((q, i) => `
          <div class="quiz-question">
            <div class="q-num">Pregunta ${i + 1} de ${questions.length}</div>
            ${audioGateHtml(q, enrollmentId, playsByQuestion)}
            <div class="q-prompt">${q.prompt}</div>
            ${q.answer_type === 'text' ? `
              <div class="quiz-text-answer" data-question="${q.id}">
                <input type="text" name="q-${q.id}" class="quiz-text-input" placeholder="Escribe UNA palabra" autocomplete="off" required>
              </div>
            ` : choices.filter(c => c.question_id === q.id).map(c => `
              <label class="quiz-choice${c.choice_text.includes('<svg') ? ' pic-choice' : ''}" data-question="${q.id}" data-choice="${c.id}">
                <input type="radio" name="q-${q.id}" value="${c.id}" required>
                <span>${c.choice_text}</span>
              </label>
            `).join('')}
          </div>
        `).join('')}
        <button type="submit" class="btn btn-accent" style="border:none;cursor:pointer;margin-top:10px;">Enviar respuestas</button>
      </form>
      <div id="quiz-result"></div>
    </div>
  `;

  container.querySelector('#quiz-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const answers = questions.map(q => {
      if(q.answer_type === 'text'){
        const input = container.querySelector(`input[name="q-${q.id}"]`);
        return { question_id: q.id, text_answer: input ? input.value.trim() : '' };
      }
      const checked = container.querySelector(`input[name="q-${q.id}"]:checked`);
      return { question_id: q.id, choice_id: checked ? checked.value : null };
    });

    if(answers.some(a => (a.choice_id === undefined || a.choice_id === null) && !a.text_answer)){
      alert('Responde todas las preguntas antes de enviar.');
      return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Calificando...';

    const { data, error } = await supabaseClient.functions.invoke('submit-quiz', {
      body: { enrollment_id: enrollmentId, module_id: moduleId, stage, answers },
    });

    if(error || data?.error){
      alert('No se pudo calificar: ' + (data?.error || error.message));
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar respuestas';
      return;
    }

    renderResult(data, container, stage);
  });
}

function renderResult(result, container, stage){
  container = container || document.getElementById('quiz-container');
  const form = container.querySelector('#quiz-form');
  form.querySelectorAll('input').forEach(i => i.disabled = true);
  form.querySelector('button[type="submit"]').style.display = 'none';

  result.feedback.forEach(f => {
    if(f.answer_type === 'text'){
      const textBox = form.querySelector(`.quiz-text-answer[data-question="${f.question_id}"]`);
      if(textBox){
        textBox.classList.add(f.is_correct ? 'correct' : 'incorrect');
        const fbEl = document.createElement('div');
        fbEl.className = 'quiz-feedback';
        fbEl.textContent = f.feedback || (f.is_correct ? '¡Correcto!' : `La respuesta correcta era: "${f.correct_text_answer}"`);
        textBox.closest('.quiz-question')?.appendChild(fbEl);
      }
      return;
    }

    const chosenLabel = f.chosen_choice_id ? form.querySelector(`.quiz-choice[data-choice="${f.chosen_choice_id}"]`) : null;
    const correctLabel = f.correct_choice_id ? form.querySelector(`.quiz-choice[data-choice="${f.correct_choice_id}"]`) : null;
    if(chosenLabel) chosenLabel.classList.add(f.is_correct ? 'correct' : 'incorrect');
    if(correctLabel && !f.is_correct) correctLabel.classList.add('correct');

    const fbEl = document.createElement('div');
    fbEl.className = 'quiz-feedback';
    fbEl.textContent = f.feedback || (f.is_correct ? '¡Correcto!' : `La respuesta correcta era: "${f.correct_choice_text}"`);
    (chosenLabel || correctLabel)?.closest('.quiz-question')?.appendChild(fbEl);
  });

  const resultEl = container.querySelector('#quiz-result');

  if(stage && stage !== 'main'){
    // ---- Formato nuevo: pasar solo avanza al siguiente paso de la lección ----
    resultEl.innerHTML = `
      <div class="quiz-result-banner ${result.passed ? 'pass' : 'fail'}">
        <div class="score">${result.score}/100</div>
        <p style="margin-top:10px;">
          ${result.passed
            ? '¡Bien hecho! Sigamos con la lección.'
            : `No alcanzaste los ${result.passing_score}/100 necesarios para continuar. Revisa la retroalimentación e inténtalo de nuevo.`}
        </p>
        ${result.passed
          ? `<button class="btn btn-accent" style="margin-top:18px;cursor:pointer;border:none;" onclick="advanceStep('${result.next_step}')">Continuar</button>`
          : `<button class="btn btn-outline" style="margin-top:18px;cursor:pointer;" onclick="renderStep('${stage === 'readings' ? 'quiz_readings' : 'quiz_interactive'}')">Intentar de nuevo</button>`}
      </div>
    `;
    resultEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  const retryBtn = result.attempts_left === null
    ? `<button class="btn btn-outline" style="margin-top:18px;cursor:pointer;" onclick="window.location.reload()">Intentar de nuevo</button>`
    : result.attempts_left > 0
      ? `<button class="btn btn-outline" style="margin-top:18px;cursor:pointer;" onclick="window.location.reload()">Intentar de nuevo (te quedan ${result.attempts_left})</button>`
      : `<p style="color:var(--wine);margin-top:14px;font-size:13px;">Ya no tienes más intentos disponibles para este examen. Escríbenos desde "¿Necesitas ayuda?" en tu Campus.</p>`;

  resultEl.innerHTML = `
    <div class="quiz-result-banner ${result.passed ? 'pass' : 'fail'}">
      <div class="score">${result.score}/100</div>
      <p style="margin-top:10px;">
        ${result.passed
          ? (result.next_module_unlocked ? '¡Aprobaste! Ya desbloqueaste el siguiente módulo.' : '¡Felicitaciones, completaste el curso! Revisa tu certificado en el Campus.')
          : `No alcanzaste los ${result.passing_score}/100 necesarios para desbloquear el siguiente módulo.`}
      </p>
      ${result.passed ? `<a href="dashboard.html" class="btn btn-accent" style="margin-top:18px;">Volver a mi Campus</a>` : retryBtn}
    </div>
  `;
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ============================================================
   FORMATO NUEVO — lección multi-paso
   ============================================================ */

let FLOW = { mod:null, lesson:null, step:'welcome' };

function initFlow(mod, progressRow){
  FLOW.mod = mod;
  FLOW.lesson = mod.lesson_json;
  FLOW.step = progressRow.completed ? 'done' : (progressRow.current_step || 'welcome');

  document.getElementById('lesson-root').innerHTML = `
    <div class="flow-head reveal in">
      <h1 class="serif" style="font-size:clamp(24px,3.2vw,34px);font-weight:700;">${mod.title}</h1>
      <div id="step-tracker" class="step-tracker"></div>
    </div>
    <div id="stage-container"></div>
  `;

  renderStepTracker();
  renderStep(FLOW.step);
}

function renderStepTracker(){
  const el = document.getElementById('step-tracker');
  const visible = STEP_ORDER.filter(s => s !== 'done');
  const currentIndex = STEP_ORDER.indexOf(FLOW.step);
  el.innerHTML = visible.map((s, i) => {
    const idx = STEP_ORDER.indexOf(s);
    const cls = idx < currentIndex || FLOW.step === 'done' ? 'done' : (idx === currentIndex ? 'active' : '');
    const dot = `<div class="step-dot ${cls}" title="${STEP_LABELS[s]}">${idx < currentIndex || FLOW.step === 'done' ? '✓' : i + 1}</div>`;
    return i < visible.length - 1 ? dot + '<div class="step-line"></div>' : dot;
  }).join('');
}

async function advanceStep(newStep){
  const { data, error } = await supabaseClient.functions.invoke('update-lesson-step', {
    body: { enrollment_id: CURRENT_ENROLLMENT_ID, module_id: CURRENT_MODULE_ID, step: newStep },
  });
  if(error || data?.error){
    alert('No se pudo avanzar: ' + (data?.error || error.message));
    return;
  }
  FLOW.step = newStep;
  renderStepTracker();
  renderStep(newStep);
  window.scrollTo({ top: 0, behavior:'smooth' });
}

function renderStep(step){
  FLOW.step = step;
  renderStepTracker();
  const c = document.getElementById('stage-container');
  const L = FLOW.lesson;

  if(step === 'welcome') return renderWelcome(c, L);
  if(step === 'reading1') return renderReading(c, L.reading1, 'reading2');
  if(step === 'reading2') return renderReading(c, L.reading2, 'quiz_readings');
  if(step === 'quiz_readings') return loadQuiz(CURRENT_ENROLLMENT_ID, CURRENT_MODULE_ID, 'readings');
  if(step === 'interactive') return renderInteractive(c, L.interactive);
  if(step === 'quiz_interactive') return loadQuiz(CURRENT_ENROLLMENT_ID, CURRENT_MODULE_ID, 'interactive');
  if(step === 'practice') return renderPractice(c, L.practice, L.speaking_tasks);
  if(step === 'closing') return renderClosing(c, L.closing_form);
  if(step === 'done') return renderDone(c);
}

function renderWelcome(c, L){
  const w = L.welcome || {};
  c.innerHTML = `
    <div class="stage-card welcome-stage reveal in">
      <div class="stage-tag" style="color:var(--gold);">Bienvenida</div>
      <h2 class="serif" style="font-size:clamp(22px,2.6vw,30px);margin:8px 0 14px;">${w.title || 'Bienvenido a esta lección'}</h2>
      <p style="color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:24px;">${w.subtitle || ''}</p>
      <div class="lesson-content-body">${w.guide_html || ''}</div>
      ${Array.isArray(w.objectives) && w.objectives.length ? `
        <div class="objectives-box">
          <div class="objectives-title">Al terminar esta lección vas a poder:</div>
          <ul class="objectives-list">${w.objectives.map(o => `<li>${o}</li>`).join('')}</ul>
        </div>
      ` : ''}
      <div class="guide-chip-grid">
        <div class="guide-chip"><div class="num">1</div><div>Empezamos con calma: dos lecturas cortas para que las bases queden firmes, sin afán</div></div>
        <div class="guide-chip"><div class="num">2</div><div>Un quiz breve — no para presionarte, sino para confirmar juntos que ya quedó claro</div></div>
        <div class="guide-chip"><div class="num">3</div><div>Si aprendes mejor viendo que leyendo, aquí repasamos lo mismo con imágenes</div></div>
        <div class="guide-chip"><div class="num">4</div><div>Un caso real, para que veas cómo se usa esto fuera del examen</div></div>
        <div class="guide-chip"><div class="num">5</div><div>Cierras resumiendo con tus propias palabras — así es como de verdad se queda grabado</div></div>
      </div>
      <button class="btn btn-accent" style="border:none;cursor:pointer;margin-top:28px;" onclick="advanceStep('reading1')">Comenzar la lección →</button>
    </div>
  `;
}

function renderReading(c, r, nextStep){
  r = r || {};
  c.innerHTML = `
    <div class="stage-card reading-stage reveal in">
      <div class="stage-tag">${r.tag || 'Lectura'}</div>
      <h2 class="serif" style="font-size:clamp(22px,2.6vw,28px);margin:8px 0 20px;">${r.title || ''}</h2>
      ${r.audio_url ? `
        <div class="audio-practice-box" style="background:var(--bg-alt);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:20px;">
          <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px;">🎧 Escucha el audio mientras lees el guion abajo — puedes reproducirlo las veces que quieras.</div>
          <audio controls style="width:100%;" src="${r.audio_url}"></audio>
        </div>
      ` : ''}
      <div class="lesson-content-body">${r.html || '<p>Sin contenido todavía.</p>'}</div>
      <button class="btn btn-accent" style="border:none;cursor:pointer;margin-top:10px;" onclick="advanceStep('${nextStep}')">Continuar →</button>
    </div>
  `;
}

function renderInteractive(c, I){
  I = I || { slides: [] };
  if(I.type === 'match') return renderMatchGame(c, I);
  return renderFlipSlides(c, I);
}

// Segundo tipo de interactivo: emparejar tarjetas (palabra ↔ significado,
// verbo ↔ pasado, phrasal verb ↔ definición...) — para que no todas las
// unidades del curso se sientan iguales al llegar aquí.
function renderMatchGame(c, I){
  const pairs = (I.pairs || []).map((p, i) => ({ ...p, id: 'p' + i }));
  const left = shuffleArr(pairs.map(p => ({ id: p.id, text: p.left })));
  const right = shuffleArr(pairs.map(p => ({ id: p.id, text: p.right })));
  let selectedLeft = null;
  let matched = new Set();

  function shuffleArr(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function paint(){
    c.innerHTML = `
      <div class="stage-card interactive-stage reveal in">
        <div class="stage-tag" style="color:var(--interactive-blue);">Lección interactiva</div>
        <h2 class="serif" style="font-size:clamp(22px,2.6vw,28px);margin:8px 0 6px;">${I.title || 'Match the pairs'}</h2>
        <p style="color:var(--muted);font-size:14px;margin-bottom:10px;">${I.intro || 'Tap one card on each side to match them.'}</p>
        <div class="slide-deck match-game">
          <div class="match-cols">
            <div>
              <div class="match-col-label">A</div>
              ${left.map(item => `<div class="match-card ${matched.has(item.id) ? 'correct' : (selectedLeft === item.id ? 'selected' : '')}" data-side="left" data-id="${item.id}" onclick="window.__matchPick('left','${item.id}')">${item.text}</div>`).join('')}
            </div>
            <div>
              <div class="match-col-label">B</div>
              ${right.map(item => `<div class="match-card ${matched.has(item.id) ? 'correct' : ''}" data-side="right" data-id="${item.id}" onclick="window.__matchPick('right','${item.id}')">${item.text}</div>`).join('')}
            </div>
          </div>
          <div class="match-status">${matched.size} / ${pairs.length} matched</div>
          <div class="slide-nav">
            <button class="btn btn-accent" style="cursor:pointer;border:none;" ${matched.size < pairs.length ? 'disabled' : ''} onclick="advanceStep('quiz_interactive')">Go to the quiz →</button>
          </div>
        </div>
      </div>
    `;
  }

  window.__matchPick = (side, id) => {
    if(matched.has(id) && side === 'right') return;
    if(side === 'left'){
      if(matched.has(id)) return;
      selectedLeft = id;
      paint();
      return;
    }
    // side === 'right'
    if(!selectedLeft) return;
    if(selectedLeft === id){
      matched.add(id);
      selectedLeft = null;
      paint();
    } else {
      const card = c.querySelector(`.match-card[data-side="right"][data-id="${id}"]`);
      if(card){
        card.classList.add('wrong');
        setTimeout(() => { selectedLeft = null; paint(); }, 350);
      }
    }
  };

  paint();
}

function renderFlipSlides(c, I){
  let idx = 0;
  const slides = I.slides || [];

  function paint(){
    const s = slides[idx] || {};
    c.innerHTML = `
      <div class="stage-card interactive-stage reveal in">
        <div class="stage-tag" style="color:var(--interactive-blue);">Lección interactiva</div>
        <h2 class="serif" style="font-size:clamp(22px,2.6vw,28px);margin:8px 0 6px;">${I.title || 'Repasemos con imágenes'}</h2>
        <p style="color:var(--muted);font-size:14px;margin-bottom:22px;">${I.intro || 'Toca cada burbuja para revelar la explicación.'}</p>
        <div class="slide-progress">${slides.map((_,i) => `<span class="${i<=idx?'active':''}"></span>`).join('')}</div>
        <div class="slide-deck">
          <div class="slide-stage-inner">
            <div class="slide-icon">${s.icon || '💡'}</div>
            <div style="width:100%;">
              <div class="slide-title">${s.title || ''}</div>
              <div class="speech-bubble" id="bubble-${idx}" onclick="this.classList.toggle('revealed')">
                <div>${s.bubble || ''}</div>
                <div class="reveal-hint">Toca para ver la explicación →</div>
                <div class="detail">${s.detail || ''}</div>
              </div>
            </div>
          </div>
          <div class="slide-nav">
            <button class="btn btn-outline" style="cursor:pointer;" ${idx===0?'disabled':''} onclick="window.__interactivePrev()">← Anterior</button>
            <span style="color:var(--muted);font-size:13px;align-self:center;">${idx+1} / ${slides.length}</span>
            ${idx < slides.length - 1
              ? `<button class="btn btn-outline" style="cursor:pointer;" onclick="window.__interactiveNext()">Siguiente →</button>`
              : `<button class="btn btn-accent" style="cursor:pointer;border:none;" onclick="advanceStep('quiz_interactive')">Ir al quiz →</button>`}
          </div>
        </div>
      </div>
    `;
  }

  window.__interactiveNext = () => { if(idx < slides.length - 1){ idx++; paint(); } };
  window.__interactivePrev = () => { if(idx > 0){ idx--; paint(); } };

  paint();
}

function renderPractice(c, p, speakingTasks){
  p = p || {};
  c.innerHTML = `
    <div class="stage-card practice-stage reveal in">
      <div class="stage-tag" style="color:var(--practice-coral);">Práctica</div>
      <h2 class="serif" style="font-size:clamp(22px,2.6vw,28px);margin:8px 0 20px;">${p.title || 'Casos de la vida real'}</h2>
      <div class="lesson-content-body">${p.html || '<p>Sin contenido todavía.</p>'}</div>
      <div id="speaking-recorder-root"></div>
      <button class="btn btn-accent" style="border:none;cursor:pointer;margin-top:10px;" onclick="advanceStep('closing')">Ir al cierre de la lección →</button>
    </div>
  `;
  if(Array.isArray(speakingTasks) && speakingTasks.length){
    renderSpeakingRecorder(document.getElementById('speaking-recorder-root'), speakingTasks);
  }
}

/* ============================================================
   GRABADORA DE SPEAKING — transcripción en vivo del navegador
   (Web Speech API, gratis, sin llave de API) + calificación por
   reglas en el servidor (submit-speaking-attempt). Práctica
   formativa: no bloquea el avance de la lección.
   ============================================================ */

function renderSpeakingRecorder(root, tasks){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  root.innerHTML = `
    <div class="speaking-practice-block" style="margin-top:30px;">
      <h3 class="serif" style="font-size:20px;margin-bottom:6px;">🎙️ Practica hablando en voz alta</h3>
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:20px;">
        Esto es una práctica que te da retroalimentación al instante — no bloquea tu avance en la lección, puedes intentarlo las veces que quieras.
      </p>
      ${!SR ? `<div class="empty-state">Tu navegador no soporta reconocimiento de voz en vivo. Usa <strong>Chrome</strong> o <strong>Edge</strong> para esta actividad (en el resto del curso funciona igual en cualquier navegador).</div>` : ''}
      <div id="speaking-tasks-list"></div>
    </div>
  `;
  if(!SR) return;

  const list = document.getElementById('speaking-tasks-list');
  tasks.forEach((task) => {
    const card = document.createElement('div');
    card.className = 'speaking-task-card';
    card.style.cssText = 'background:var(--bg-alt);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;';
    card.innerHTML = `
      <div style="font-weight:700;font-size:13px;color:var(--practice-coral);margin-bottom:6px;">${task.label || 'Práctica de speaking'}</div>
      <p style="font-size:14px;line-height:1.6;margin-bottom:16px;">${task.prompt}</p>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
        <button type="button" class="btn btn-accent" style="border:none;cursor:pointer;" data-role="rec-btn">🎙️ Empezar a grabar</button>
        <span data-role="timer" style="font-size:13px;color:var(--muted);"></span>
      </div>
      <div data-role="transcript" style="min-height:40px;font-size:14px;line-height:1.6;padding:12px 14px;background:var(--bg);border-radius:10px;border:1px solid var(--line);color:var(--muted);font-style:italic;">Tu transcripción va a aparecer aquí mientras hablas...</div>
      <div data-role="result" style="margin-top:14px;"></div>
    `;
    list.appendChild(card);
    wireSpeakingTask(card, task);
  });
}

function wireSpeakingTask(card, task){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recBtn = card.querySelector('[data-role="rec-btn"]');
  const timerEl = card.querySelector('[data-role="timer"]');
  const transcriptEl = card.querySelector('[data-role="transcript"]');
  const resultEl = card.querySelector('[data-role="result"]');

  let recognition = null;
  let recording = false;
  let startTime = null;
  let timerInterval = null;
  let finalTranscript = '';

  function fmtTime(sec){
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function startRecording(){
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = true;

    finalTranscript = '';
    transcriptEl.style.fontStyle = 'normal';
    transcriptEl.style.color = 'var(--ink)';
    transcriptEl.textContent = 'Escuchando...';
    resultEl.innerHTML = '';

    recognition.onresult = (event) => {
      let interim = '';
      for(let i = event.resultIndex; i < event.results.length; i++){
        const chunk = event.results[i][0].transcript;
        if(event.results[i].isFinal) finalTranscript += chunk + ' ';
        else interim += chunk;
      }
      transcriptEl.textContent = (finalTranscript + interim).trim() || 'Escuchando...';
    };

    recognition.onerror = () => {
      // Algunos navegadores mandan 'no-speech' si hay silencio — no es un
      // error fatal, dejamos que el estudiante siga o pare manualmente.
    };

    recognition.onend = () => {
      if(recording){
        // El navegador a veces corta la sesión sola tras una pausa larga;
        // si el estudiante no ha dado "Detener", la reiniciamos.
        try { recognition.start(); } catch(_) {}
      }
    };

    recognition.start();
    recording = true;
    startTime = Date.now();
    recBtn.textContent = '⏹ Detener grabación';
    timerInterval = setInterval(() => {
      timerEl.textContent = fmtTime((Date.now() - startTime) / 1000);
    }, 250);
  }

  async function stopRecording(){
    recording = false;
    clearInterval(timerInterval);
    if(recognition){
      try { recognition.stop(); } catch(_) {}
    }
    const durationSeconds = (Date.now() - startTime) / 1000;
    recBtn.disabled = true;
    recBtn.textContent = 'Calificando...';

    const { data, error } = await supabaseClient.functions.invoke('submit-speaking-attempt', {
      body: {
        enrollment_id: CURRENT_ENROLLMENT_ID,
        module_id: CURRENT_MODULE_ID,
        task_id: task.id,
        transcript: finalTranscript.trim(),
        duration_seconds: durationSeconds,
      },
    });

    recBtn.disabled = false;
    recBtn.textContent = '🎙️ Grabar de nuevo';

    if(error || data?.error){
      resultEl.innerHTML = `<p style="color:var(--wine);font-size:13px;">No se pudo calificar: ${data?.error || error.message}</p>`;
      return;
    }

    resultEl.innerHTML = `
      <div class="quiz-result-banner ${data.passed ? 'pass' : 'fail'}" style="margin-top:6px;">
        <div class="score">${data.score}/100</div>
        <p style="margin-top:8px;font-size:13.5px;">
          Hablaste ${Math.round(data.duration_seconds)}s (meta: ${data.min_seconds}s) · ${data.words} palabras (meta: ${data.min_words}) ·
          mencionaste ${data.matched_keywords.length} de ${data.total_keywords} palabras/frases clave esperadas.
        </p>
        ${data.matched_keywords.length ? `<p style="margin-top:6px;font-size:12.5px;color:var(--muted);">Detectadas: ${data.matched_keywords.join(', ')}</p>` : ''}
        <p style="margin-top:10px;font-size:12.5px;color:var(--muted);">Esto es práctica formativa — no bloquea tu avance. Puedes grabar de nuevo cuando quieras.</p>
      </div>
    `;
  }

  recBtn.addEventListener('click', () => {
    if(!recording) startRecording();
    else stopRecording();
  });
}

function renderClosing(c, form){
  form = form || { fields: [] };
  c.innerHTML = `
    <div class="stage-card closing-stage reveal in">
      <div class="stage-tag" style="color:var(--gold);">Cierre de la lección</div>
      <h2 class="serif" style="font-size:clamp(22px,2.6vw,28px);margin:8px 0 10px;">${form.title || 'Sella lo que aprendiste'}</h2>
      <p style="color:var(--muted);font-size:14px;margin-bottom:26px;">${form.intro || 'Responde con tus propias palabras — esto no se califica, es para que el conocimiento quede fijo.'}</p>
      <form id="closing-form">
        ${(form.fields || []).map(f => `
          <div class="form-field">
            <label for="cf-${f.id}">${f.label}</label>
            ${f.type === 'textarea'
              ? `<textarea id="cf-${f.id}" name="${f.id}" placeholder="${f.placeholder || ''}" required></textarea>`
              : `<input type="text" id="cf-${f.id}" name="${f.id}" placeholder="${f.placeholder || ''}" required>`}
          </div>
        `).join('')}
        <button type="submit" class="btn btn-accent" style="border:none;cursor:pointer;margin-top:10px;">Enviar y cerrar la lección</button>
      </form>
      <div id="closing-result"></div>
    </div>
  `;

  document.getElementById('closing-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const answers = {};
    fd.forEach((v,k) => answers[k] = v);

    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Guardando...';

    const { data, error } = await supabaseClient.functions.invoke('submit-closing-form', {
      body: { enrollment_id: CURRENT_ENROLLMENT_ID, module_id: CURRENT_MODULE_ID, answers },
    });

    if(error || data?.error){
      alert('No se pudo guardar: ' + (data?.error || error.message));
      btn.disabled = false; btn.textContent = 'Enviar y cerrar la lección';
      return;
    }

    FLOW.step = 'done';
    renderStepTracker();
    document.getElementById('closing-result').innerHTML = `
      <div class="quiz-result-banner pass">
        <div class="score">${data.grade}/100</div>
        <p style="margin-top:10px;">${data.next_module_unlocked ? '¡Lección completada! Ya desbloqueaste el siguiente módulo.' : '¡Felicitaciones, completaste el curso! Revisa tu certificado en el Campus.'}</p>
        <a href="dashboard.html" class="btn btn-accent" style="margin-top:18px;">Volver a mi Campus</a>
      </div>
    `;
    e.target.style.display = 'none';
  });
}

function renderDone(c){
  c.innerHTML = `
    <div class="stage-card reveal in" style="text-align:center;padding:60px 30px;">
      <div style="font-size:44px;margin-bottom:14px;">🎉</div>
      <h2 class="serif" style="font-size:24px;margin-bottom:12px;">Ya completaste esta lección</h2>
      <p style="color:var(--muted);margin-bottom:26px;">Puedes volver a repasar cualquier parte desde el mapa de arriba o seguir con tu Campus.</p>
      <a href="dashboard.html" class="btn btn-accent">Volver a mi Campus</a>
    </div>
  `;
}
